<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />

  <g opacity="0.06">
    <line x1="0" y1="80" x2="600" y2="80" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="160" x2="600" y2="160" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="240" x2="600" y2="240" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="320" x2="600" y2="320" stroke="#94a3b8" stroke-width="1" />
    <line x1="120" y1="0" x2="120" y2="400" stroke="#94a3b8" stroke-width="1" />
    <line x1="240" y1="0" x2="240" y2="400" stroke="#94a3b8" stroke-width="1" />
    <line x1="360" y1="0" x2="360" y2="400" stroke="#94a3b8" stroke-width="1" />
    <line x1="480" y1="0" x2="480" y2="400" stroke="#94a3b8" stroke-width="1" />
  </g>

  <circle cx="520" cy="60" r="80" fill="#4338ca" opacity="0.04" />
  <circle cx="80" cy="340" r="60" fill="#2563eb" opacity="0.03" />

  <!-- Peer AS nodes -->
  <g font-family="system-ui, sans-serif">
    <!-- Peer links -->
    <g opacity="0.55">
      <line x1="110" y1="110" x2="270" y2="185" stroke="#4338ca" stroke-width="2" />
      <line x1="110" y1="290" x2="270" y2="215" stroke="#4338ca" stroke-width="2" />
      <line x1="490" y1="110" x2="330" y2="185" stroke="#4338ca" stroke-width="2" />
      <line x1="490" y1="290" x2="330" y2="215" stroke="#4338ca" stroke-width="2" />
    </g>

    <!-- Router core -->
    <g transform="translate(300, 200)">
      <rect x="-46" y="-30" width="92" height="60" rx="10" fill="#ffffff" stroke="#4338ca" stroke-width="2.5" />
      <text x="0" y="-6" text-anchor="middle" font-size="12" fill="#4338ca" font-weight="700">BGP</text>
      <text x="0" y="10" text-anchor="middle" font-size="10" fill="#6b7280">router</text>
    </g>

    <!-- Peers -->
    <g transform="translate(110, 110)">
      <circle cx="0" cy="0" r="26" fill="#eef2ff" stroke="#818cf8" stroke-width="2" />
      <text x="0" y="4" text-anchor="middle" font-size="11" fill="#4338ca" font-weight="600">AS1</text>
    </g>
    <g transform="translate(110, 290)">
      <circle cx="0" cy="0" r="26" fill="#eef2ff" stroke="#818cf8" stroke-width="2" />
      <text x="0" y="4" text-anchor="middle" font-size="11" fill="#4338ca" font-weight="600">AS2</text>
    </g>
    <g transform="translate(490, 110)">
      <circle cx="0" cy="0" r="26" fill="#eef2ff" stroke="#818cf8" stroke-width="2" />
      <text x="0" y="4" text-anchor="middle" font-size="11" fill="#4338ca" font-weight="600">AS3</text>
    </g>
    <g transform="translate(490, 290)">
      <circle cx="0" cy="0" r="26" fill="#eef2ff" stroke="#818cf8" stroke-width="2" />
      <text x="0" y="4" text-anchor="middle" font-size="11" fill="#4338ca" font-weight="600">AS4</text>
    </g>
  </g>

  <!-- Forwarding table (top) -->
  <g transform="translate(210, 40)" font-family="monospace">
    <rect x="0" y="0" width="180" height="70" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <rect x="0" y="0" width="180" height="20" rx="8" fill="#eef2ff" />
    <rect x="0" y="10" width="180" height="10" fill="#eef2ff" />
    <text x="90" y="14" text-anchor="middle" font-size="9" fill="#4338ca" font-weight="700">FORWARDING TABLE</text>
    <text x="10" y="34" font-size="9" fill="#374151">192.168.0.0/16 → AS1</text>
    <text x="10" y="48" font-size="9" fill="#374151">10.0.0.0/8    → AS3</text>
    <text x="10" y="62" font-size="9" fill="#374151">172.16.0.0/12 → AS2</text>
  </g>

  <!-- Title chip -->
  <g transform="translate(180, 348)">
    <rect x="0" y="0" width="240" height="30" rx="15" fill="#e0e7ff" />
    <text x="120" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#4338ca" font-weight="700">BGP routing · aggregation</text>
  </g>
</svg>
