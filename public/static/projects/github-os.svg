<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6d28d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />

  <!-- Subtle grid -->
  <g opacity="0.06">
    <line x1="0" y1="80" x2="600" y2="80" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="160" x2="600" y2="160" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="240" x2="600" y2="240" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="320" x2="600" y2="320" stroke="#94a3b8" stroke-width="1" />
    <line x1="120" y1="0" x2="120" y2="400" stroke="#94a3b8" stroke-width="1" />
    <line x1="240" y1="0" x2="240" y2="400" stroke="#94a3b8" stroke-width="1" />
    <line x1="360" y1="0" x2="360" y2="400" stroke="#94a3b8" stroke-width="1" />
    <line x1="480" y1="0" x2="480" y2="400" stroke="#94a3b8" stroke-width="1" />
  </g>

  <circle cx="520" cy="60" r="80" fill="#7c3aed" opacity="0.04" />
  <circle cx="80" cy="340" r="60" fill="#3b82f6" opacity="0.03" />

  <!-- Stacked PR branch graph (left) -->
  <g transform="translate(70, 60)">
    <!-- main trunk -->
    <line x1="0" y1="10" x2="0" y2="280" stroke="#cbd5e1" stroke-width="3" />
    <!-- stacked branch line -->
    <path d="M0 40 C 40 40, 40 40, 40 70 L 40 250 C 40 280, 40 280, 0 280" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.7" />

    <!-- trunk commit dots -->
    <circle cx="0" cy="10" r="7" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5" />
    <circle cx="0" cy="280" r="7" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5" />

    <!-- PR nodes on the stack -->
    <circle cx="40" cy="70" r="8" fill="#7c3aed" />
    <circle cx="40" cy="130" r="8" fill="#6d28d9" />
    <circle cx="40" cy="190" r="8" fill="#3b82f6" />
    <circle cx="40" cy="250" r="8" fill="#2563eb" />
  </g>

  <!-- PR stack cards (right) -->
  <g font-family="system-ui, sans-serif">
    <!-- Card 1 -->
    <rect x="150" y="72" width="400" height="56" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <rect x="150" y="72" width="4" height="56" rx="2" fill="#7c3aed" />
    <circle cx="176" cy="100" r="7" fill="none" stroke="#7c3aed" stroke-width="2" />
    <path d="M173 100 l2.5 2.5 l4.5 -5" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" />
    <text x="196" y="96" font-size="12" fill="#111827" font-weight="600">#1  feat: extract parser interface</text>
    <text x="196" y="114" font-size="10" fill="#6b7280">draft · +42 −18 · base: main</text>

    <!-- Card 2 -->
    <rect x="150" y="140" width="400" height="56" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <rect x="150" y="140" width="4" height="56" rx="2" fill="#6d28d9" />
    <circle cx="176" cy="168" r="7" fill="none" stroke="#6d28d9" stroke-width="2" />
    <path d="M173 168 l2.5 2.5 l4.5 -5" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linecap="round" />
    <text x="196" y="164" font-size="12" fill="#111827" font-weight="600">#2  feat: classify signal types</text>
    <text x="196" y="182" font-size="10" fill="#6b7280">draft · +67 −5 · base: #1</text>

    <!-- Card 3 -->
    <rect x="150" y="208" width="400" height="56" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <rect x="150" y="208" width="4" height="56" rx="2" fill="#3b82f6" />
    <circle cx="176" cy="236" r="7" fill="none" stroke="#3b82f6" stroke-width="2" />
    <path d="M173 236 l2.5 2.5 l4.5 -5" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
    <text x="196" y="232" font-size="12" fill="#111827" font-weight="600">#3  feat: wire synthesizer output</text>
    <text x="196" y="250" font-size="10" fill="#6b7280">draft · +31 −2 · base: #2</text>

    <!-- Fixup card -->
    <rect x="150" y="276" width="400" height="56" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" />
    <rect x="150" y="276" width="4" height="56" rx="2" fill="#d97706" />
    <text x="168" y="300" font-family="monospace" font-size="11" fill="#d97706" font-weight="700">$ git commit --fixup</text>
    <text x="168" y="320" font-family="monospace" font-size="11" fill="#4b5563">→ rebase --autosquash · resolve</text>
  </g>

  <!-- Title chip -->
  <g transform="translate(70, 350)">
    <rect x="0" y="0" width="200" height="30" rx="15" fill="#ede9fe" />
    <text x="100" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#6d28d9" font-weight="700">GitHub as control plane</text>
  </g>
</svg>
