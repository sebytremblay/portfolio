<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />

  <g opacity="0.06">
    <line x1="0" y1="80" x2="600" y2="80" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="160" x2="600" y2="160" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="240" x2="600" y2="240" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="320" x2="600" y2="320" stroke="#94a3b8" stroke-width="1" />
    <line x1="120" y1="0" x2="120" y2="400" stroke="#94a3b8" stroke-width="1" />
    <line x1="240" y1="0" x2="240" y2="400" stroke="#94a3b8" stroke-width="1" />
    <line x1="360" y1="0" x2="360" y2="400" stroke="#94a3b8" stroke-width="1" />
    <line x1="480" y1="0" x2="480" y2="400" stroke="#94a3b8" stroke-width="1" />
  </g>

  <circle cx="520" cy="60" r="80" fill="#ea580c" opacity="0.04" />
  <circle cx="80" cy="340" r="60" fill="#d97706" opacity="0.03" />

  <!-- Pipeline connectors -->
  <g opacity="0.55">
    <line x1="150" y1="150" x2="250" y2="150" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="5,4" />
    <line x1="350" y1="150" x2="450" y2="150" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="5,4" />
  </g>

  <!-- Lead intake chip -->
  <g transform="translate(90, 60)" font-family="monospace">
    <rect x="0" y="0" width="120" height="30" rx="15" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" />
    <text x="60" y="20" text-anchor="middle" font-size="11" fill="#c2410c" font-weight="700">POST /leads</text>
  </g>

  <!-- Stage 1: Research -->
  <g transform="translate(60, 122)" font-family="system-ui, sans-serif">
    <circle cx="45" cy="28" r="32" fill="#ea580c" opacity="0.12" />
    <circle cx="45" cy="28" r="24" fill="#ffffff" stroke="#ea580c" stroke-width="2.5" />
    <circle cx="42" cy="25" r="8" fill="none" stroke="#ea580c" stroke-width="2.5" />
    <line x1="48" y1="31" x2="55" y2="38" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" />
    <text x="45" y="80" text-anchor="middle" font-size="12" fill="#9a3412" font-weight="700">Research</text>
    <text x="45" y="96" text-anchor="middle" font-family="monospace" font-size="9" fill="#78716c">agent + Exa</text>
  </g>

  <!-- Stage 2: Build -->
  <g transform="translate(255, 122)" font-family="system-ui, sans-serif">
    <circle cx="45" cy="28" r="32" fill="#ea580c" opacity="0.12" />
    <circle cx="45" cy="28" r="24" fill="#ffffff" stroke="#ea580c" stroke-width="2.5" />
    <path d="M35 22 l-6 6 l6 6 M55 22 l6 6 l-6 6" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="45" y="80" text-anchor="middle" font-size="12" fill="#9a3412" font-weight="700">Build</text>
    <text x="45" y="96" text-anchor="middle" font-family="monospace" font-size="9" fill="#78716c">copy + ROI</text>
  </g>

  <!-- Stage 3: Publish -->
  <g transform="translate(450, 122)" font-family="system-ui, sans-serif">
    <circle cx="45" cy="28" r="32" fill="#ea580c" opacity="0.12" />
    <circle cx="45" cy="28" r="24" fill="#ffffff" stroke="#ea580c" stroke-width="2.5" />
    <path d="M45 40 l0 -18 M38 29 l7 -7 l7 7" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="45" y="80" text-anchor="middle" font-size="12" fill="#9a3412" font-weight="700">Publish</text>
    <text x="45" y="96" text-anchor="middle" font-family="monospace" font-size="9" fill="#78716c">public S3</text>
  </g>

  <!-- Published one-pager -->
  <g transform="translate(210, 250)">
    <rect x="0" y="0" width="180" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <rect x="0" y="0" width="180" height="18" rx="8" fill="#ea580c" opacity="0.9" />
    <rect x="0" y="10" width="180" height="8" fill="#ea580c" opacity="0.9" />
    <circle cx="12" cy="9" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="22" cy="9" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="32" cy="9" r="3" fill="#ffffff" opacity="0.8" />
    <rect x="14" y="30" width="90" height="8" rx="4" fill="#292524" />
    <rect x="14" y="44" width="152" height="5" rx="2.5" fill="#d6d3d1" />
    <rect x="14" y="54" width="130" height="5" rx="2.5" fill="#d6d3d1" />
    <rect x="14" y="66" width="56" height="10" rx="5" fill="#fed7aa" />
  </g>

  <!-- Title chip -->
  <g transform="translate(175, 352)">
    <rect x="0" y="0" width="250" height="30" rx="15" fill="#ffedd5" />
    <text x="125" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#c2410c" font-weight="700">lead &#8594; live one-pager</text>
  </g>
</svg>
