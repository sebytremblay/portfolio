<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />

  <g opacity="0.06">
    <line x1="0" y1="80" x2="600" y2="80" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="160" x2="600" y2="160" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="240" x2="600" y2="240" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="320" x2="600" y2="320" stroke="#94a3b8" stroke-width="1" />
    <line x1="120" y1="0" x2="120" y2="400" stroke="#94a3b8" stroke-width="1" />
    <line x1="240" y1="0" x2="240" y2="400" stroke="#94a3b8" stroke-width="1" />
    <line x1="360" y1="0" x2="360" y2="400" stroke="#94a3b8" stroke-width="1" />
    <line x1="480" y1="0" x2="480" y2="400" stroke="#94a3b8" stroke-width="1" />
  </g>

  <circle cx="520" cy="60" r="80" fill="#0d9488" opacity="0.04" />
  <circle cx="80" cy="340" r="60" fill="#0891b2" opacity="0.03" />

  <!-- Cluster: leader + followers -->
  <!-- AppendEntries links -->
  <g opacity="0.5">
    <line x1="300" y1="120" x2="150" y2="230" stroke="#0d9488" stroke-width="2" stroke-dasharray="5,4" />
    <line x1="300" y1="120" x2="450" y2="230" stroke="#0d9488" stroke-width="2" stroke-dasharray="5,4" />
    <line x1="300" y1="120" x2="220" y2="300" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.7" />
    <line x1="300" y1="120" x2="380" y2="300" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.7" />
  </g>

  <!-- Leader node -->
  <g transform="translate(300, 120)">
    <circle cx="0" cy="0" r="34" fill="#0d9488" opacity="0.12" />
    <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#0d9488" stroke-width="2.5" />
    <text x="0" y="-2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#0d9488" font-weight="700">LEADER</text>
    <text x="0" y="12" text-anchor="middle" font-family="monospace" font-size="9" fill="#6b7280">term 4</text>
  </g>

  <!-- Follower nodes -->
  <g font-family="system-ui, sans-serif">
    <g transform="translate(150, 230)">
      <circle cx="0" cy="0" r="24" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
      <text x="0" y="4" text-anchor="middle" font-size="9" fill="#475569" font-weight="600">FOLLOWER</text>
    </g>
    <g transform="translate(450, 230)">
      <circle cx="0" cy="0" r="24" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
      <text x="0" y="4" text-anchor="middle" font-size="9" fill="#475569" font-weight="600">FOLLOWER</text>
    </g>
    <g transform="translate(220, 300)">
      <circle cx="0" cy="0" r="24" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
      <text x="0" y="4" text-anchor="middle" font-size="9" fill="#475569" font-weight="600">FOLLOWER</text>
    </g>
    <g transform="translate(380, 300)">
      <circle cx="0" cy="0" r="24" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
      <text x="0" y="4" text-anchor="middle" font-size="9" fill="#475569" font-weight="600">FOLLOWER</text>
    </g>
  </g>

  <!-- Replicated log (top-right) -->
  <g transform="translate(430, 40)" font-family="monospace">
    <text x="0" y="0" font-size="10" fill="#0d9488" font-weight="700">LOG</text>
    <rect x="0" y="8" width="26" height="26" rx="3" fill="#0d9488" opacity="0.85" />
    <text x="13" y="26" text-anchor="middle" font-size="11" fill="#fff">x1</text>
    <rect x="30" y="8" width="26" height="26" rx="3" fill="#0d9488" opacity="0.85" />
    <text x="43" y="26" text-anchor="middle" font-size="11" fill="#fff">y7</text>
    <rect x="60" y="8" width="26" height="26" rx="3" fill="#0d9488" opacity="0.85" />
    <text x="73" y="26" text-anchor="middle" font-size="11" fill="#fff">z2</text>
    <rect x="90" y="8" width="26" height="26" rx="3" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="103" y="26" text-anchor="middle" font-size="11" fill="#94a3b8">?</text>
  </g>

  <!-- Title chip -->
  <g transform="translate(180, 348)">
    <rect x="0" y="0" width="240" height="30" rx="15" fill="#ccfbf1" />
    <text x="120" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f766e" font-weight="700">Raft consensus · fault tolerant</text>
  </g>
</svg>
