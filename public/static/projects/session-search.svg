<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6d28d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#db2777;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />

  <g opacity="0.06">
    <line x1="0" y1="80" x2="600" y2="80" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="160" x2="600" y2="160" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="240" x2="600" y2="240" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="320" x2="600" y2="320" stroke="#94a3b8" stroke-width="1" />
    <line x1="120" y1="0" x2="120" y2="400" stroke="#94a3b8" stroke-width="1" />
    <line x1="240" y1="0" x2="240" y2="400" stroke="#94a3b8" stroke-width="1" />
    <line x1="360" y1="0" x2="360" y2="400" stroke="#94a3b8" stroke-width="1" />
    <line x1="480" y1="0" x2="480" y2="400" stroke="#94a3b8" stroke-width="1" />
  </g>

  <circle cx="520" cy="60" r="80" fill="#7c3aed" opacity="0.04" />
  <circle cx="80" cy="340" r="60" fill="#db2777" opacity="0.03" />

  <!-- Search bar -->
  <g transform="translate(90, 56)">
    <rect x="0" y="0" width="420" height="46" rx="23" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" />
    <circle cx="30" cy="23" r="9" fill="none" stroke="#6d28d9" stroke-width="2.5" />
    <line x1="37" y1="30" x2="44" y2="37" stroke="#6d28d9" stroke-width="2.5" stroke-linecap="round" />
    <text x="58" y="28" font-family="monospace" font-size="13" fill="#374151">where did I debug the auth flow?</text>
  </g>

  <!-- Result rows -->
  <g font-family="system-ui, sans-serif">
    <!-- Row 1 (matched) -->
    <rect x="90" y="128" width="420" height="58" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <rect x="90" y="128" width="4" height="58" rx="2" fill="#7c3aed" />
    <text x="108" y="150" font-size="11" fill="#111827" font-weight="600">session · 2026-03-14</text>
    <text x="108" y="170" font-size="10" fill="#4b5563">...traced the <tspan fill="#6d28d9" font-weight="700">auth</tspan> redirect loop to a stale cookie...</text>
    <rect x="440" y="142" width="56" height="20" rx="10" fill="#ede9fe" />
    <text x="468" y="156" text-anchor="middle" font-size="9" fill="#6d28d9" font-weight="700">98%</text>

    <!-- Row 2 -->
    <rect x="90" y="196" width="420" height="58" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <rect x="90" y="196" width="4" height="58" rx="2" fill="#db2777" />
    <text x="108" y="218" font-size="11" fill="#111827" font-weight="600">session · 2026-02-28</text>
    <text x="108" y="238" font-size="10" fill="#4b5563">...rewrote the token refresh to handle 401s...</text>
    <rect x="440" y="210" width="56" height="20" rx="10" fill="#fce7f3" />
    <text x="468" y="224" text-anchor="middle" font-size="9" fill="#db2777" font-weight="700">81%</text>

    <!-- Row 3 -->
    <rect x="90" y="264" width="420" height="58" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <rect x="90" y="264" width="4" height="58" rx="2" fill="#94a3b8" />
    <text x="108" y="286" font-size="11" fill="#111827" font-weight="600">session · 2026-01-19</text>
    <text x="108" y="306" font-size="10" fill="#4b5563">...added session middleware to the router...</text>
    <rect x="440" y="278" width="56" height="20" rx="10" fill="#f1f5f9" />
    <text x="468" y="292" text-anchor="middle" font-size="9" fill="#64748b" font-weight="700">64%</text>
  </g>

  <!-- Title chip -->
  <g transform="translate(200, 344)">
    <rect x="0" y="0" width="200" height="30" rx="15" fill="#ede9fe" />
    <text x="100" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#6d28d9" font-weight="700">Search your sessions</text>
  </g>
</svg>
